# Milvus Standalone + Attu 管理界面。
#
# 启动：docker compose -f compose.milvus.yaml up -d
# 状态：docker compose -f compose.milvus.yaml ps
# 停止：docker compose -f compose.milvus.yaml down
#
# 默认仅监听本机，避免未启用鉴权的 Milvus 暴露到公网。如确需远程访问，
# 请在 .env 中显式设置 MILVUS_BIND_ADDRESS / ATTU_BIND_ADDRESS，并同时配置
# 防火墙、反向代理和 Milvus 鉴权。

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - milvus-etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - milvus-minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.6.22
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "${MILVUS_BIND_ADDRESS:-127.0.0.1}:${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_BIND_ADDRESS:-127.0.0.1}:${MILVUS_HEALTH_PORT:-9091}:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      start_period: 90s
      retries: 3

  attu:
    image: zilliz/attu:v3.0.0
    restart: unless-stopped
    environment:
      MILVUS_ADDRESS: milvus:19530
      MILVUS_NAME: report-generation-milvus
      MILVUS_DATABASE: default
    volumes:
      - attu-data:/data
    ports:
      - "${ATTU_BIND_ADDRESS:-127.0.0.1}:${ATTU_PORT:-3000}:3000"
    depends_on:
      milvus:
        condition: service_healthy

volumes:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  attu-data:

