<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 176" role="img" aria-labelledby="title desc">
  <title id="title">乳腺MRI轴位定位示意底图</title>
  <desc id="desc">用于演示病灶定位联动的非诊断性灰阶乳腺轴位示意图，不代表真实患者影像。</desc>
