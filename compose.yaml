# WSL / Linux 启动说明：
# 1. 先启动 Milvus、etcd、MinIO 和 Attu：
#    docker compose -f compose.milvus.yaml up -d
# 2. 确认 Milvus 状态正常：
#    docker compose -f compose.milvus.yaml ps
# 3. 再启动报告生成服务：
#    docker compose up -d
# 4. 查看全部服务状态：
#    docker compose ps
#    docker compose -f compose.milvus.yaml ps
# 停止服务：
#    docker compose down
#    docker compose -f compose.milvus.yaml down

x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
  image: report-generation:latest
  env_file:
    - .env
  environment:
    PYTHONUNBUFFERED: "1"
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  worker:
    <<: *common-config
    container_name: report-generation-worker
    environment:
      PYTHONUNBUFFERED: "1"
      # 容器内不能使用 127.0.0.1 访问宿主机映射端口；两个 Compose
      # 文件从同一目录启动时共享项目默认网络，可直接使用服务名 milvus。
      MILVUS_URI: http://milvus:19530
    command:
      - uvicorn
      - app.chat.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    expose:
      - "8000"
    ports:
      # 宿主机端口 8011（避开现有服务占用的 8080）；容器内仍为 8000
      - "8011:8000"
    volumes:
      # Excel 切片文件
      - ./app/data_pipeline/xlsx_slices:/app/app/data_pipeline/xlsx_slices
      # 知识库原始 Excel（代码实际路径为 app/data_pipeline/report_template，
      # 见 server.py 上传与 source_path 回退逻辑；挂载后新上传的知识库可持久化）
      - ./app/data_pipeline/report_template:/app/app/data_pipeline/report_template
      # 知识库 Markdown 切片（build_vector_db 的输入，重建向量库时依赖）
      - ./app/data_pipeline/output_markdown:/app/app/data_pipeline/output_markdown
      # 会话持久化
      - ./data:/app/data
      # 长期记忆
      - ./app/memory/data:/app/app/memory/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  gateway:
    <<: *common-config
    container_name: report-generation-gateway
    command:
      - uvicorn
      - app.gateway:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    ports:
      # 宿主机端口 8012（避开现有服务占用的 8081）；容器内仍为 8001
      - "8012:8001"
    environment:
      PYTHONUNBUFFERED: "1"
      WORKER_BASE_URL: http://worker:8000
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      # Gateway 仅注册代理路由，无 /health；用 FastAPI 自带的 /docs 探活
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
