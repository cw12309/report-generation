    腰椎序列规整，腰骶椎生理曲度正常。其余腰椎椎体骨质形态、骨髓信号未见异常；附件结构完整。其余椎间盘形态、信号正常（Pfirrmann I~II级）。腰4-5节段椎间孔未见明显狭窄，马尾神经走行自然。

    扫描范围内未见异常。'
