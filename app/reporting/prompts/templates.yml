templates:
- route_id: lumbar_mri
  name: 腰椎 MRI优秀范例_10-25
  tags: []
  match_keywords:
  - 腰椎退行性病变
  imaging_findings: '腰4-5椎间盘向后突出，致中央椎管中度狭窄(Lee 2级)，硬膜囊受压，神经根未见明确受压。

    腰椎序列规整，腰骶椎生理曲度正常。其余腰椎椎体骨质形态、骨髓信号未见异常；附件结构完整。其余椎间盘形态、信号正常（Pfirrmann I~II级）。腰4-5节段椎间孔未见明显狭窄，马尾神经走行自然。

    扫描范围内未见异常。'
  imaging_diagnosis: '腰椎退行性变：腰4-5椎间盘突出，伴中央椎管中度狭窄(Lee 2级)。

    建议骨科门诊结合临床症状对症处理，6~12个月复查腰椎MRI评估病情。'
  source: session
  enabled: true
  quality_score: 5
  id: tpl_20261026_003106
  updated_at: '2026-10-26 00:31:06'
  usage_count: 7
  created_at: '2026-10-26 00:31:06'
- name: 心脏 MRI·冠心病，左室前壁陈旧性心肌梗死伴急性心肌水肿
  route_id: cardiac_mri
  tags: []
  match_keywords:
  - 冠心病
  imaging_findings: '左室前壁心肌见心内膜下LGE延迟强化，对应节段室壁运动减弱，LVEF=35%（HFrEF）。该节段心肌伴T2高信号水肿改变。心肌其余节段厚度均匀，未见弥漫性出血信号。各瓣膜开合良好，心包无增厚及积液。

    心脏整体形态规整，房室比例协调，大血管连接正常。室间隔连续性存在。

    扫描范围内双肺、纵隔、胸壁未见异常。'
  imaging_diagnosis: '冠心病，左室前壁陈旧性心肌梗死伴急性心肌水肿，左室收缩功能减退（HFrEF）。

    建议心血管内科就诊，规范冠心病二级预防及抗心衰治疗，6~12个月复查心脏MRI评估心肌状态。'
  enabled: true
  quality_score: 5
  source: session
  id: tpl_20261101_195945
  updated_at: '2026-11-02 09:54:50'
  usage_count: 2
  created_at: '2026-11-01 19:59:45'
